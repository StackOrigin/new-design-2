Highlights of this year's results include:
• 45 students secured GPA 4.0 (Outstanding)
• 120 students secured GPA 3.6 and above
• School average GPA improved from 3.4 to 3.7

We congratulate all our students and thank the parents for their continued support.`,featured:!0},{id:2,title:"Annual Science Exhibition 2024 — Innovation at Its Finest",category:"Events",date:"2024-05-28",author:"Admin",image:"/images/science-lab.jpg",excerpt:"Our annual science exhibition showcased over 80 innovative projects by students from Grade 5 to Grade 12, impressing judges with creativity and scientific thinking.",content:`The Annual Science Exhibition 2024 was a spectacular display of young minds at work. Over 80 projects were presented by students from Grade 5 to Grade 12, covering topics ranging from renewable energy to artificial intelligence.

This year's theme was "Science for Sustainable Development" and the projects truly embodied this theme with innovative solutions to real-world problems.`,featured:!0},{id:3,title:"New Computer Lab Inaugurated with 60 Latest Workstations",category:"Infrastructure",date:"2024-05-10",author:"Admin",image:"/images/computer-lab.jpg",excerpt:"A state-of-the-art computer lab with 60 high-performance workstations has been inaugurated, boosting our digital learning capabilities for students.",content:"Global Academy Secondary School is pleased to announce the inauguration of our brand-new computer laboratory, equipped with 60 high-performance workstations and the latest educational software. This expansion will significantly enhance our digital learning environment.",featured:!1},{id:4,title:"Inter-School Sports Championship 2024 — Champions Again!",category:"Sports",date:"2024-04-22",author:"Admin",image:"/images/sports.jpg",excerpt:"Global Academy Secondary School's sports teams dominated the inter-school championship, winning gold medals in football, basketball, and athletics events.",content:"Our sports teams have once again proven their excellence by winning the Inter-School Sports Championship 2024. Our students brought home gold medals in multiple sports events, showcasing their talent and team spirit.",featured:!1},{id:5,title:"Admission Open for Academic Year 2025-26",category:"Admissions",date:"2024-04-01",author:"Admin",image:"/images/campus-aerial.jpg",excerpt:"Admissions are now open for the academic year 2025-26 for Grade PP to Grade 12. Limited seats available. Apply early to secure your child's future.",content:"We are pleased to announce that admissions are now open for the academic year 2025-26. We welcome applications for grades from Pre-Primary (PP) to Grade 12. Our admission process is transparent, merit-based, and inclusive.",featured:!0},{id:6,title:"Library Renovation Completed — 15,000+ Books Available",category:"Infrastructure",date:"2024-03-15",author:"Admin",image:"/images/library.jpg",excerpt:"Our newly renovated library now hosts over 15,000 books with modern reading areas, digital resources, and a dedicated research zone for students.",content:"After months of renovation, our school library has been transformed into a modern learning hub. The revamped library now features over 15,000 books, comfortable reading areas, computer terminals for digital research, and a dedicated quiet study zone.",featured:!1},{id:7,title:"Annual Prize Distribution Ceremony 2024 — Celebrating Student Excellence",category:"Academic Achievement",date:"2024-07-20",author:"Admin",image:"/images/prize distribuiton.jpg",excerpt:"The annual prize distribution ceremony honored over 200 outstanding students for their academic achievements, sportsmanship, and contributions to school life.",content:"The Annual Prize Distribution Ceremony 2024 was a grand celebration of student excellence. Over 200 students were awarded for their outstanding performance in academics, sports, and extracurricular activities. The ceremony was graced by chief guests from the education sector and proud parents.",featured:!0},{id:8,title:"Students Excel at Regional Science Exhibition — Multiple Awards Won",category:"Events",date:"2024-06-05",author:"Admin",image:"/images/exibition.jpg",excerpt:"Our students brought home 5 awards at the Regional Science Exhibition, showcasing innovative projects in renewable energy and environmental science.",content:"Global Academy students showcased their scientific prowess at the Regional Science Exhibition 2024. Our students presented 12 innovative projects and won 5 awards including Best Project in Environmental Science. The exhibition provided a platform for young scientists to present their research and ideas.",featured:!0},{id:9,title:"Educational Field Trip to Historical Sites — Learning Beyond Classrooms",category:"Events",date:"2024-05-15",author:"Admin",image:"/images/outing.jpg",excerpt:"Students from Grade 8-10 enjoyed an educational field trip to UNESCO heritage sites, combining learning with exploration and creating lasting memories.",content:"Our annual educational field trip took students from Grade 8-10 to various UNESCO World Heritage Sites in Nepal. The trip combined education with exploration, allowing students to learn about Nepal's rich cultural heritage, history, and architecture firsthand.",featured:!1}],Ua=[{id:1,title:"Annual Sports Day 2025",date:"2025-02-15",time:"8:00 AM – 4:00 PM",location:"School Sports Ground",category:"Sports",description:"The annual sports day featuring athletics, team sports, and fun events for all students from PP to Grade 12.",upcoming:!0},{id:2,title:"Parent-Teacher Meeting — Term II",date:"2025-01-25",time:"10:00 AM – 1:00 PM",location:"School Auditorium",category:"Academic",description:"Term II progress review meeting for parents and teachers to discuss student performance and development.",upcoming:!0},{id:3,title:"Cultural Program & Annual Day",date:"2025-03-05",time:"3:00 PM – 7:00 PM",location:"School Auditorium",category:"Cultural",description:"Join us for our spectacular annual cultural program featuring performances, awards, and celebrations.",upcoming:!0},{id:4,title:"Science & Technology Fair",date:"2025-03-20",time:"9:00 AM – 3:00 PM",location:"School Campus",category:"Academic",description:"Annual science and technology fair showcasing student projects and innovations.",upcoming:!0},{id:5,title:"Grade 12 Board Exam Begins",date:"2025-04-01",time:"7:30 AM",location:"Exam Halls",category:"Examination",description:"NEB Grade 12 Board Examination begins. Best wishes to all Grade 12 students.",upcoming:!0},{id:6,title:"Inter-School Debate Competition",date:"2025-02-08",time:"11:00 AM – 4:00 PM",location:"School Auditorium",category:"Academic",description:"Annual inter-school debate competition bringing together students from 20+ schools.",upcoming:!0}],us=[{id:1,title:"School Campus Aerial View",category:"Campus",image:"/image
